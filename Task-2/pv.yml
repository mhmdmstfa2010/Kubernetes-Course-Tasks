apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
spec:
  nodeAffinity:
   required:
    nodeSelectorTerms:
      - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: [minikube-m02]
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/webapp-mysql
    type: DirectoryOrCreate
